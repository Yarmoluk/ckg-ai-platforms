[build-system]
requires = ["hatchling<1.32"]
build-backend = "hatchling.build"

[project]
name = "ckg-ai-platforms"
version = "0.3.0"
description = "AI developer and agent platforms as source-pinned traversable knowledge graphs - MCP-native"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Daniel Yarmoluk", email = "daniel.yarmoluk@gmail.com" }]
keywords = ["langchain", "openai", "anthropic", "knowledge-graph", "mcp", "ai-agents", "huggingface", "bedrock", "vertex-ai", "palantir", "semantic-kernel"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = ["mcp[cli]>=2.2.0,<3"]

[project.scripts]
ckg-ai-platforms = "ckg_ai_platforms.server:main"

[project.urls]
Homepage = "https://graphifymd.com"
Repository = "https://github.com/Yarmoluk/ckg-ai-platforms"
"Bug Tracker" = "https://github.com/Yarmoluk/ckg-ai-platforms/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ckg_ai_platforms"]
